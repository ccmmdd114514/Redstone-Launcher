[package]
name = "redstone-launcher"
version = "0.9.0-beta.5"
edition = "2021"
description = "红石启动器 Redstone Launcher：Minecraft Java 版启动器内核"

[[bin]]
name = "redstone"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
zip = "2"
sha1 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v5"] }
anyhow = "1"
futures = "0.3"

# 把 assets\icon.ico 编译进 exe 的资源段，让 redstone.exe 带上红石方块图标。
# 图标源文件由 tools\make-icons.py 生成。
[build-dependencies]
winresource = "0.1"

# Windows 控制台 API：启用 ANSI 彩色输出、读取单个按键（数字键菜单用）。
# 只在 Windows 上引入；本启动器目前只面向 Windows。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[profile.release]
opt-level = 2
